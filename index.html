<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Home Energy</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--tx:#f2f3f5;--mu:#8b92a0;--ac:#38d39f}
@media(prefers-color-scheme:light){:root{--bg:#f4f5f7;--card:#fff;--tx:#14161a;--mu:#6a7280;--ac:#0a9e72}}
*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);color:var(--tx);font:16px -apple-system,system-ui,sans-serif;max-width:560px;margin:auto}
h1{font-size:15px;color:var(--mu);font-weight:500;margin:4px 0 12px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
.big{font-size:48px;font-weight:700}.big small{font-size:20px;color:var(--mu)}
.mu{color:var(--mu);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .card{margin:0}.v{font-size:24px;font-weight:600}
svg{width:100%;height:90px;display:block;margin-top:8px}
.stale{color:#e5a03a}
</style></head><body>
<h1>Home energy · imported electricity</h1>
<div class="card"><div class="big" id="w">–<small> W</small></div>
<div class="mu" id="upd">loading…</div><svg id="spark" viewBox="0 0 300 90" preserveAspectRatio="none"></svg></div>
<div class="grid" id="win"></div>
<div class="card" style="margin-top:12px"><div class="mu">Last 24 hours (kWh per hour)</div><svg id="hr" viewBox="0 0 240 90" preserveAspectRatio="none"></svg></div>
<div class="card"><div class="mu">Last 7 days (kWh per day)</div><svg id="dy" viewBox="0 0 70 90" preserveAspectRatio="none"></svg></div>
<div class="card"><div class="mu">Meter total</div><div class="v" id="tot"></div><div class="mu" id="since"></div></div>
<script>
const f=(n,d=2)=>n==null?'–':n.toFixed(d);
function bars(id,arr,w){const v=arr.map(x=>x.kwh??0),m=Math.max(...v,0.01);
 document.getElementById(id).innerHTML=v.map((k,i)=>`<rect x="${i*w+w*.1}" y="${90-k/m*86}" width="${w*.8}" height="${k/m*86}" fill="var(--ac)" rx="1"/>`).join('')}
fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{
 w.firstChild.nodeValue=d.live_w;
 const age=Math.round((Date.now()/1000-d.updated)/60);
 upd.textContent='Updated '+(age<1?'just now':age+' min ago');upd.className='mu'+(age>20?' stale':'');
 const pts=d.recent,mx=Math.max(...pts.map(p=>p[1]),1),t0=pts[0][0],t1=pts[pts.length-1][0]||1;
 spark.innerHTML=`<polyline fill="none" stroke="var(--ac)" stroke-width="2" vector-effect="non-scaling-stroke" points="${pts.map(p=>((p[0]-t0)/Math.max(t1-t0,1)*300)+','+(88-p[1]/mx*84)).join(' ')}"/>`;
 const L={hour:'Last hour',today:'Today',yesterday:'Yesterday',week:'Last 7 days'};
 win.innerHTML=Object.entries(L).map(([k,n])=>{const x=d.windows[k];
  return `<div class="card"><div class="mu">${n}</div><div class="v">${x?f(x.kwh)+' kWh':'–'}</div><div class="mu">${x?(x.hours<(k=='hour'?.95:k=='today'?0:k=='yesterday'?23.5:167)?'only '+f(x.hours,1)+' h logged · ':'')+'avg '+f(x.kwh/x.hours*1000,0)+' W':'no data yet'}</div></div>`}).join('');
 bars('hr',d.hourly,10);bars('dy',d.daily,10);
 tot.textContent=f(d.total_kwh,3)+' kWh';since.textContent='Logging since '+new Date(d.since*1000).toLocaleString();
});
setTimeout(()=>location.reload(),300000);
</script></body></html>
